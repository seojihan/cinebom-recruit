<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 완료 · 씨네픽</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap wide">
      <a class="brand" href="./"><span data-c="siteName">씨네픽</span><small>크리에이터 모집</small></a>
    </div>
  </header>

  <main class="wrap">
    <section class="thanks">
      <div class="mark" aria-hidden="true">✓</div>
      <p class="eyebrow">지원서 접수 완료</p>
      <h1><span class="who">씨네픽</span>에 지원해 주셔서<br>진심으로 감사드립니다</h1>
      <p class="lead">보내 주신 지원서는 운영진이 한 편씩 직접 읽고 살펴보겠습니다. 마감일 없이 받고 꼼꼼히 심사하는 만큼 결과 안내까지 시간이 꽤 걸릴 수 있습니다. 합격하신 분께는 적어 주신 메일로 활동 코드와 함께 연락드리겠습니다.</p>
      <p class="no" hidden></p>
      <div class="row"><a class="btn" href="./">모집 안내로 돌아가기</a></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      var r = null;
      try { r = JSON.parse(sessionStorage.getItem("cinepick-receipt") || "null"); } catch (e) {}
      var k = new URLSearchParams(location.search).get("k") || (r && r.kind);
      var role = k === "critic" ? "평론가" : k === "director" ? "감독" : "";
      if (role) document.querySelector(".who").textContent = "씨네픽 " + role;
      if (r && r.no) {
        var el = document.querySelector(".no");
        el.textContent = (r.name ? r.name + " 님 · " : "") + "접수번호 " + r.no;
        el.hidden = false;
      }
    })();
  </script>
</body>
</html>
